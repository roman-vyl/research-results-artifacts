<meta charset="UTF-8">
<title>EMA200 Sweep Explorer</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<style>
  :root{
    --page: #f9f9f7; --surface: #fcfcfb; --surface-2: #f3f2ee;
    --ink: #0b0b0b; --ink-2: #52514e; --ink-muted: #898781;
    --hair: #e1e0d9; --axis: #c3c2b7;
    --accent: #2a78d6;
    --s1: #2a78d6; /* aggregate — blue */
    --s2: #eb6834; /* long — orange */
    --s3: #1baf7a; /* short — aqua/green */
    --s4: #eda100; /* alt — yellow */
    --s8: #e34948; /* drawdown/risk — red */
    --plateau: rgba(42,120,214,0.08);
    --plateau-ring: rgba(42,120,214,0.28);
    --ring: rgba(11,11,11,0.10);
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --page: #0d0d0d; --surface: #1a1a19; --surface-2: #232322;
      --ink: #ffffff; --ink-2: #c3c2b7; --ink-muted: #898781;
      --hair: #2c2c2a; --axis: #383835;
      --accent: #3987e5;
      --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s8: #e66767;
      --plateau: rgba(57,135,229,0.14); --plateau-ring: rgba(57,135,229,0.35);
      --ring: rgba(255,255,255,0.10);
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"]{
    --page: #0d0d0d; --surface: #1a1a19; --surface-2: #232322;
    --ink: #ffffff; --ink-2: #c3c2b7; --ink-muted: #898781;
    --hair: #2c2c2a; --axis: #383835;
    --accent: #3987e5;
    --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s8: #e66767;
    --plateau: rgba(57,135,229,0.14); --plateau-ring: rgba(57,135,229,0.35);
    --ring: rgba(255,255,255,0.10);
    color-scheme: dark;
  }

  *{box-sizing:border-box;}
  body{ margin:0; background:var(--page); color:var(--ink);
    font-family:"IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
    padding-inline:20px; padding-block:26px; }
  .num{ font-family:"IBM Plex Mono", ui-monospace, monospace; font-variant-numeric: tabular-nums; }
  .wrap{ max-width:1080px; margin:0 auto; display:flex; flex-direction:column; gap:18px; }

  header{ display:flex; flex-direction:column; gap:5px; }
  .eyebrow{ font-family:"IBM Plex Mono", monospace; font-size:11px; letter-spacing:.08em; text-transform:uppercase; color:var(--accent); font-weight:600; }
  h1{ font-size:23px; margin:0; font-weight:700; letter-spacing:-0.01em; text-wrap:balance; }
  .sub{ color:var(--ink-2); font-size:13.5px; line-height:1.5; max-width:74ch; margin:0; }

  .tabs{ display:flex; gap:6px; border-bottom:1px solid var(--hair); }
  .tab{ appearance:none; border:none; background:transparent; font:inherit; font-size:13.5px; font-weight:600;
    color:var(--ink-muted); padding:9px 14px; cursor:pointer; border-bottom:2px solid transparent; margin-bottom:-1px; }
  .tab[aria-selected="true"]{ color:var(--ink); border-bottom-color:var(--accent); }
  .tab:hover{ color:var(--ink); }

  .layout{ display:flex; gap:18px; align-items:flex-start; }
  .sidebar{ width:230px; flex-shrink:0; display:flex; flex-direction:column; gap:14px; position:sticky; top:16px; }
  .main{ flex:1; min-width:0; display:flex; flex-direction:column; gap:14px; }

  .cluster{ background:var(--surface); border:1px solid var(--ring); border-radius:9px; padding:11px 12px; }
  .cluster-title{ font-family:"IBM Plex Mono", monospace; font-size:10px; letter-spacing:.07em; text-transform:uppercase;
    color:var(--ink-muted); margin-bottom:7px; }
  .opt{ display:flex; align-items:center; gap:7px; padding:3px 0; font-size:12.5px; cursor:pointer; }
  .opt input{ accent-color:var(--dot,var(--accent)); width:13px; height:13px; }
  .opt .dot{ width:9px; height:9px; border-radius:50%; flex-shrink:0; }
  .opt .lbl{ flex:1; }
  .opt .dash{ width:14px; height:0; border-top:2px dashed var(--ink-muted); flex-shrink:0; opacity:.7; }
  .note{ font-size:11px; color:var(--ink-muted); line-height:1.4; margin-top:6px; }

  .toggle-row{ display:flex; align-items:center; gap:8px; padding:8px 12px; background:var(--surface); border:1px solid var(--ring); border-radius:9px; font-size:12px; color:var(--ink-2); }
  .toggle-row input{ accent-color:var(--accent); }

  .panel{ background:var(--surface); border:1px solid var(--ring); border-radius:10px; padding:14px 16px 10px; }
  .panel-head{ display:flex; justify-content:space-between; align-items:baseline; margin-bottom:4px; }
  .panel-title{ font-size:12.5px; font-weight:600; color:var(--ink); }
  .panel-unit{ font-family:"IBM Plex Mono", monospace; font-size:10.5px; color:var(--ink-muted); }
  .legend{ display:flex; flex-wrap:wrap; gap:10px 14px; font-size:11px; color:var(--ink-2); margin:2px 0 8px; }
  .legend span{ display:inline-flex; align-items:center; gap:5px; }
  .legend .sw{ width:11px; height:2.5px; border-radius:2px; }
  svg.chart{ display:block; width:100%; height:auto; overflow:visible; }
  .gridline{ stroke:var(--hair); stroke-width:1; }
  .axisline{ stroke:var(--axis); stroke-width:1; }
  .zeroline{ stroke:var(--ink-muted); stroke-width:1; stroke-dasharray:2 3; }
  .refline{ stroke:var(--ink-muted); stroke-width:1; stroke-dasharray:2 3; }
  .tick{ font-family:"IBM Plex Mono", monospace; font-size:9.5px; fill:var(--ink-muted); }
  .series-path{ fill:none; stroke-width:1.8; }
  .series-path.dashed{ stroke-dasharray:4 3; }
  .plateau-rect{ fill:var(--plateau); }
  .plateau-edge{ stroke:var(--plateau-ring); stroke-width:1; stroke-dasharray:3 2; }
  .plateau-label{ font-family:"IBM Plex Mono", monospace; font-size:9px; fill:var(--ink-muted); }
  .hover-line{ stroke:var(--ink-muted); stroke-width:1; opacity:0; pointer-events:none; }
  .hover-dot{ opacity:0; pointer-events:none; }
  .hit-rect{ fill:transparent; cursor:crosshair; }
  .empty-panel{ font-size:12px; color:var(--ink-muted); padding:22px 0; text-align:center; }

  .tooltip{ position:fixed; pointer-events:none; z-index:50; background:var(--surface); border:1px solid var(--hair);
    border-radius:8px; padding:9px 11px; font-size:11px; color:var(--ink-2); box-shadow:0 8px 24px rgba(0,0,0,.22);
    min-width:150px; opacity:0; transition:opacity .08s ease; }
  .tooltip.show{ opacity:1; }
  .tooltip .tt-head{ color:var(--ink); font-weight:600; font-size:12px; margin-bottom:5px; font-family:"IBM Plex Mono",monospace; }
  .tooltip .row{ display:flex; justify-content:space-between; gap:12px; padding:1.5px 0; }
  .tooltip .row .v{ font-family:"IBM Plex Mono", monospace; color:var(--ink); font-variant-numeric: tabular-nums; }

  footer{ font-size:11px; color:var(--ink-muted); padding-top:2px; }
  footer .prov{ font-family:"IBM Plex Mono", monospace; }

  @media (max-width: 760px){
    .layout{ flex-direction:column; }
    .sidebar{ width:100%; position:static; flex-direction:row; flex-wrap:wrap; }
    .cluster{ flex:1; min-width:150px; }
  }
</style>

<div class="wrap">
  <header>
    <div class="eyebrow">BTCUSDT.P · 5m · EMA 100/200/500 · Research Evidence</div>
    <h1>Single-parameter sweep explorer</h1>
    <p class="sub">
      Two independent baseline studies, one varied parameter each. Pick any metric alone, or several at once
      when their units match — everything on a panel shares one axis, never mixed scales.
    </p>
  </header>

  <div class="tabs" role="tablist">
    <button class="tab" role="tab" aria-selected="true" data-test="width_sweep">Stack width (1–35 ATR)</button>
    <button class="tab" role="tab" aria-selected="false" data-test="untouched_anchor_sweep">Untouched lookback (1–300 bars)</button>
  </div>

  <div class="layout">
    <div class="sidebar" id="sidebar"></div>
    <div class="main" id="main">
      <div class="toggle-row">
        <input type="checkbox" id="plateau-toggle" checked>
        <label for="plateau-toggle">Show approved plateau region (findings f001)</label>
      </div>
      <div id="panels"></div>
    </div>
  </div>

  <footer>
    <span class="prov" id="prov-line"></span>
  </footer>
</div>

<div class="tooltip" id="tooltip"></div>

const state = { test: "width_sweep", checked: new Set(), plateau: true };
CLUSTERS.forEach(c => c.series.forEach(s => { if (s.defaultOn) state.checked.add(s.key); }));

function seriesByKey(key){
  for (const c of CLUSTERS) for (const s of c.series) if (s.key === key) return { cluster: c, series: s };
  return null;
}

function renderSidebar(){
  const el = document.getElementById("sidebar");
  el.innerHTML = "";
  for (const cluster of CLUSTERS){
    const box = document.createElement("div");
    box.className = "cluster";
    const title = document.createElement("div");
    title.className = "cluster-title";
    title.textContent = cluster.title + " · " + cluster.unit;
    box.appendChild(title);
    for (const s of cluster.series){
      const row = document.createElement("label");
      row.className = "opt";
      row.innerHTML = `
        <input type="checkbox" ${state.checked.has(s.key) ? "checked" : ""} data-key="${s.key}">
        <span class="dot" style="background:${s.color}"></span>
        <span class="lbl">${s.label}</span>
        ${s.dashed ? '<span class="dash"></span>' : ""}
      `;
      row.querySelector("input").addEventListener("change", (e) => {
        if (e.target.checked) state.checked.add(s.key); else state.checked.delete(s.key);
        renderPanels();
      });
      box.appendChild(row);
    }
    if (cluster.note){
      const note = document.createElement("div");
      note.className = "note";
      note.textContent = cluster.note;
      box.appendChild(note);
    }
    el.appendChild(box);
  }
}

function fmtVal(key, v){
  if (v === null || v === undefined || Number.isNaN(v)) return "—";
  const info = seriesByKey(key);
  if (info && info.cluster.pct) return (v * 100).toFixed(2) + "%";
  if (key.includes("trade")) return Math.round(v).toLocaleString("en-US");
  if (info && info.cluster.id === "pf") return v.toFixed(3);
  return v.toFixed(2);
}

const tooltip = document.getElementById("tooltip");

function renderChart(cluster, rows){
  const activeSeries = cluster.series.filter(s => state.checked.has(s.key));
  const width = 900, height = 190, padL = 46, padR = 14, padT = 10, padB = 26;
  const innerW = width - padL - padR, innerH = height - padT - padB;

  const wrap = document.createElement("div");
  wrap.className = "panel";

  const head = document.createElement("div");
  head.className = "panel-head";
  head.innerHTML = `<span class="panel-title">${cluster.title}</span><span class="panel-unit">${cluster.unit}</span>`;
  wrap.appendChild(head);

  if (activeSeries.length === 0){
    const empty = document.createElement("div");
    empty.className = "empty-panel";
    empty.textContent = "No series selected in this cluster.";
    wrap.appendChild(empty);
    return wrap;
  }

  const legend = document.createElement("div");
  legend.className = "legend";
  legend.innerHTML = activeSeries.map(s =>
    `<span><span class="sw" style="background:${s.color};${s.dashed ? 'background-image:linear-gradient(90deg,'+s.color+' 60%,transparent 0);background-size:6px 2.5px;' : ''}"></span>${s.label}</span>`
  ).join("");
  wrap.appendChild(legend);

  const xs = rows.map(r => r.x);
  const xMin = Math.min(...xs), xMax = Math.max(...xs);

  let yMin = Infinity, yMax = -Infinity;
  for (const s of activeSeries){
    for (const r of rows){
      const v = r[s.key];
      if (v === null || v === undefined) continue;
      if (v < yMin) yMin = v;
      if (v > yMax) yMax = v;
    }
  }
  if (cluster.refline !== undefined){ yMin = Math.min(yMin, cluster.refline); yMax = Math.max(yMax, cluster.refline); }
  if (!Number.isFinite(yMin) || !Number.isFinite(yMax)) { yMin = 0; yMax = 1; }
  if (yMin === yMax){ yMin -= 1; yMax += 1; }
  const ySpan = yMax - yMin;
  const yPad = ySpan * 0.08;
  yMin -= yPad; yMax += yPad;

  const xScale = (x) => padL + ((x - xMin) / (xMax - xMin || 1)) * innerW;
  const yScale = (y) => padT + innerH - ((y - yMin) / (yMax - yMin || 1)) * innerH;

  const svgNS = "http://www.w3.org/2000/svg";
  const svg = document.createElementNS(svgNS, "svg");
  svg.setAttribute("class", "chart");
  svg.setAttribute("viewBox", `0 0 ${width} ${height}`);
  svg.setAttribute("preserveAspectRatio", "xMidYMid meet");

  // gridlines (y) + ticks
  const yTickCount = 4;
  for (let i = 0; i <= yTickCount; i++){
    const yv = yMin + (ySpan + 2*yPad) * (i / yTickCount);
    const gy = yScale(yv);
    const line = document.createElementNS(svgNS, "line");
    line.setAttribute("class", "gridline");
    line.setAttribute("x1", padL); line.setAttribute("x2", width - padR);
    line.setAttribute("y1", gy); line.setAttribute("y2", gy);
    svg.appendChild(line);
    const label = document.createElementNS(svgNS, "text");
    label.setAttribute("class", "tick");
    label.setAttribute("x", padL - 6); label.setAttribute("y", gy + 3);
    label.setAttribute("text-anchor", "end");
    label.textContent = cluster.pct ? (yv*100).toFixed(0) + "%" : (Math.abs(yv) >= 100 ? Math.round(yv) : yv.toFixed(1));
    svg.appendChild(label);
  }

  // zero reference line if 0 is within range and meaningful
  if (yMin < 0 && yMax > 0 && !cluster.refline){
    const zy = yScale(0);
    const zl = document.createElementNS(svgNS, "line");
    zl.setAttribute("class", "zeroline");
    zl.setAttribute("x1", padL); zl.setAttribute("x2", width - padR);
    zl.setAttribute("y1", zy); zl.setAttribute("y2", zy);
    svg.appendChild(zl);
  }
  if (cluster.refline !== undefined){
    const ry = yScale(cluster.refline);
    const rl = document.createElementNS(svgNS, "line");
    rl.setAttribute("class", "refline");
    rl.setAttribute("x1", padL); rl.setAttribute("x2", width - padR);
    rl.setAttribute("y1", ry); rl.setAttribute("y2", ry);
    svg.appendChild(rl);
    const rt = document.createElementNS(svgNS, "text");
    rt.setAttribute("class", "tick");
    rt.setAttribute("x", width - padR); rt.setAttribute("y", ry - 4);
    rt.setAttribute("text-anchor", "end");
    rt.textContent = "breakeven";
    svg.appendChild(rt);
  }

  // plateau band
  if (state.plateau && PLATEAUS[state.test]){
    const pl = PLATEAUS[state.test];
    const x1 = xScale(Math.max(pl.from, xMin)), x2 = xScale(Math.min(pl.to, xMax));
    const rect = document.createElementNS(svgNS, "rect");
    rect.setAttribute("class", "plateau-rect");
    rect.setAttribute("x", x1); rect.setAttribute("y", padT);
    rect.setAttribute("width", Math.max(0, x2 - x1)); rect.setAttribute("height", innerH);
    svg.appendChild(rect);
    for (const xv of [x1, x2]){
      const el = document.createElementNS(svgNS, "line");
      el.setAttribute("class", "plateau-edge");
      el.setAttribute("x1", xv); el.setAttribute("x2", xv);
      el.setAttribute("y1", padT); el.setAttribute("y2", padT + innerH);
      svg.appendChild(el);
    }
  }

  // x ticks
  const xTickCount = Math.min(7, xs.length);
  for (let i = 0; i <= xTickCount; i++){
    const xv = xMin + (xMax - xMin) * (i / xTickCount);
    const gx = xScale(xv);
    const label = document.createElementNS(svgNS, "text");
    label.setAttribute("class", "tick");
    label.setAttribute("x", gx); label.setAttribute("y", height - 6);
    label.setAttribute("text-anchor", "middle");
    label.textContent = Math.round(xv);
    svg.appendChild(label);
  }

  // axis lines
  const axX = document.createElementNS(svgNS, "line");
  axX.setAttribute("class", "axisline");
  axX.setAttribute("x1", padL); axX.setAttribute("x2", width - padR);
  axX.setAttribute("y1", padT + innerH); axX.setAttribute("y2", padT + innerH);
  svg.appendChild(axX);

  // series paths
  for (const s of activeSeries){
    let d = "";
    let started = false;
    for (const r of rows){
      const v = r[s.key];
      if (v === null || v === undefined){ started = false; continue; }
      const px = xScale(r.x), py = yScale(v);
      d += (started ? "L" : "M") + px.toFixed(2) + "," + py.toFixed(2) + " ";
      started = true;
    }
    const path = document.createElementNS(svgNS, "path");
    path.setAttribute("class", "series-path" + (s.dashed ? " dashed" : ""));
    path.setAttribute("d", d.trim());
    path.setAttribute("stroke", s.color);
    svg.appendChild(path);
  }

  // hover crosshair + dots
  const hoverLine = document.createElementNS(svgNS, "line");
  hoverLine.setAttribute("class", "hover-line");
  hoverLine.setAttribute("y1", padT); hoverLine.setAttribute("y2", padT + innerH);
  svg.appendChild(hoverLine);

  const dots = activeSeries.map(s => {
    const c = document.createElementNS(svgNS, "circle");
    c.setAttribute("class", "hover-dot");
    c.setAttribute("r", 3);
    c.setAttribute("fill", s.color);
    svg.appendChild(c);
    return c;
  });

  const hit = document.createElementNS(svgNS, "rect");
  hit.setAttribute("class", "hit-rect");
  hit.setAttribute("x", padL); hit.setAttribute("y", padT);
  hit.setAttribute("width", innerW); hit.setAttribute("height", innerH);
  svg.appendChild(hit);

  hit.addEventListener("mousemove", (e) => {
    const rect = svg.getBoundingClientRect();
    const svgX = ((e.clientX - rect.left) / rect.width) * width;
    const xVal = xMin + ((svgX - padL) / innerW) * (xMax - xMin);
    let nearest = rows[0], best = Infinity;
    for (const r of rows){
      const d = Math.abs(r.x - xVal);
      if (d < best){ best = d; nearest = r; }
    }
    const hx = xScale(nearest.x);
    hoverLine.setAttribute("x1", hx); hoverLine.setAttribute("x2", hx);
    hoverLine.style.opacity = 1;
    let rowsHtml = "";
    activeSeries.forEach((s, i) => {
      const v = nearest[s.key];
      if (v !== null && v !== undefined){
        dots[i].setAttribute("cx", hx); dots[i].setAttribute("cy", yScale(v));
        dots[i].style.opacity = 1;
      } else {
        dots[i].style.opacity = 0;
      }
      rowsHtml += `<div class="row"><span>${s.label}</span><span class="v">${fmtVal(s.key, v)}</span></div>`;
    });
    tooltip.innerHTML = `<div class="tt-head">x = ${nearest.x}</div>${rowsHtml}`;
    tooltip.style.left = (e.clientX + 16) + "px";
    tooltip.style.top = (e.clientY + 16) + "px";
    tooltip.classList.add("show");
  });
  hit.addEventListener("mouseleave", () => {
    hoverLine.style.opacity = 0;
    dots.forEach(d => d.style.opacity = 0);
    tooltip.classList.remove("show");
  });

  wrap.appendChild(svg);
  return wrap;
}

function renderPanels(){
  const rows = DATA[state.test];
  const panels = document.getElementById("panels");
  panels.innerHTML = "";
  for (const cluster of CLUSTERS){
    panels.appendChild(renderChart(cluster, rows));
  }
  document.getElementById("prov-line").textContent = PROV[state.test] + " · x-axis: " + XLABEL[state.test];
}

document.querySelectorAll(".tab").forEach(btn => {
  btn.addEventListener("click", () => {
    state.test = btn.dataset.test;
    document.querySelectorAll(".tab").forEach(b => b.setAttribute("aria-selected", b === btn ? "true" : "false"));
    renderPanels();
  });
});
document.getElementById("plateau-toggle").addEventListener("change", (e) => {
  state.plateau = e.target.checked;
  renderPanels();
});

renderSidebar();
renderPanels();
</script>
